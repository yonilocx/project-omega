<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Omega - Locked ICT Terminal</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; text-align: center; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        input { padding: 12px; font-size: 16px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; width: 220px; text-align: center; }
        button { padding: 12px 24px; font-size: 16px; margin-top: 10px; border-radius: 5px; border: none; background: #f0b90b; color: #000; font-weight: bold; cursor: pointer; }
        .dashboard { display: none; margin-top: 20px; }
        .chart-box { height: 550px; width: 100%; max-width: 1200px; margin: 0 auto; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <h2>?? Project Omega Security Check</h2>
        <p>Enter Passcode to Access ICT Gold Terminal</p>
        <input type="password" id="passcode" placeholder="Enter Passcode">
        <button onclick="unlockTerminal()">Unlock Terminal</button>
        <p id="err-msg" style="color: #ff5555; display: none;">Invalid Passcode</p>
    </div>

    <div id="main-terminal" class="dashboard">
        <h1 style="color: #f0b90b;">Project Omega: Gold ICT Dashboard</h1>
        <p>Live Asian Range Sweeps, BOS, FVG, & Execution Monitoring</p>
        <div class="chart-box" id="tv_chart"></div>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        function unlockTerminal() {
            var input = document.getElementById("passcode").value;
            // PASSCODE SET TO: omega2026
            if (input === "omega2026") {
                document.getElementById("login-overlay").style.display = "none";
                document.getElementById("main-terminal").style.display = "block";
                new TradingView.widget({
                    "width": "100%",
                    "height": 550,
                    "symbol": "OANDA:XAUUSD",
                    "interval": "15",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "toolbar_bg": "#f1f3f6",
                    "enable_publishing": false,
                    "allow_symbol_change": true,
                    "container_id": "tv_chart"
                });
            } else {
                document.getElementById("err-msg").style.display = "block";
            }
        }
    </script>
</body>
</html>
